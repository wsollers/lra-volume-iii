statement:
  canonical_prose: Supremum of a Difference Set
  canonical_latex: "\\begin{theorem}[Supremum of a Difference Set]\n\\label{thm:supremum-difference-set}\n\
    Let $A,B\\subseteq\\mathbb{R}$ be nonempty, with $A$ bounded above and $B$\nbounded\
    \ below.  Then $A-B:=\\{a-b:a\\in A,\\ b\\in B\\}$ is nonempty and bounded\nabove,\
    \ and\n\\[\n  \\sup(A-B)=\\sup A-\\inf B.\n\\]\n\\hyperref[prf:supremum-difference-set]{Go\
    \ to proof.}\n\\end{theorem}"
