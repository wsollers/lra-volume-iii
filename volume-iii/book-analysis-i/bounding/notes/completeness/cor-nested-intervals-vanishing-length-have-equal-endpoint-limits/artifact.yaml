statement:
  canonical_prose: Nested Intervals with Vanishing Length Have Equal Endpoint Limits
  canonical_latex: "\\begin{corollary}[Nested Intervals with Vanishing Length Have\
    \ Equal Endpoint Limits]\n\\label{cor:nested-intervals-vanishing-length-have-equal-endpoint-limits}\n\
    Let $(a_n)$ and $(b_n)$ satisfy\n\\[\n  (\\forall n\\in\\mathbb{N})(a_n\\leq b_n),\n\
    \\]\n\\[\n  (\\forall n\\in\\mathbb{N})([a_{n+1},b_{n+1}]\\subseteq [a_n,b_n]),\n\
    \\]\nand\n\\[\n  (\\forall\\varepsilon>0)(\\exists N\\in\\mathbb{N})(\\forall\
    \ n\\in\\mathbb{N})\n  \\bigl(n\\geq N\\Longrightarrow b_n-a_n<\\varepsilon\\\
    bigr).\n\\]\nThen there exists $x\\in\\mathbb{R}$ such that\n\\[\n  \\lim_{n\\\
    longrightarrow\\infty}a_n=x\n  \\qquad\\text{and}\\qquad\n  \\lim_{n\\longrightarrow\\\
    infty}b_n=x.\n\\]\n\\hyperref[prf:nested-intervals-vanishing-length-have-equal-endpoint-limits]{Go\
    \ to proof.}\n\\end{corollary}"
