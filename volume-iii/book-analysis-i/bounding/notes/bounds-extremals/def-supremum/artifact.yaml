statement:
  canonical_prose: Supremum
  canonical_latex: "\\begin{definition}[Supremum]\n\\label{def:supremum}\nLet $(S,\\\
    leq)$ be a partially ordered set, let $A\\subseteq S$, and let\n$s\\in S$. The\
    \ element $s$ is the \\emph{supremum} of $A$, written\n$s=\\sup A$, if\n\\[\n\
    \  (\\forall a\\in A)(a\\leq s)\n\\]\nand\n\\[\n  (\\forall u\\in S)\n  \\left[\n\
    \    (\\forall a\\in A)(a\\leq u)\n    \\Longrightarrow\n    s\\leq u\n  \\right].\n\
    \\]\nThus, $s$ is the least upper bound of $A$ in $S$.\n\\end{definition}"
