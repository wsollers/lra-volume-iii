statement:
  canonical_prose: Supremum of a Dilation
  canonical_latex: "\\begin{theorem}[Supremum of a Dilation]\n\\label{thm:supremum-dilation}\n\
    Let $A\\subseteq\\mathbb{R}$ be nonempty and bounded, and let\n$\\lambda\\in\\\
    mathbb{R}$.  Then $\\lambda A:=\\{\\lambda a:a\\in A\\}$ is nonempty\nand bounded\
    \ above, and\n\\[\n  \\sup(\\lambda A)=\n  \\begin{cases}\n    \\lambda\\sup A,\
    \ & \\lambda>0,\\\\\n    0, & \\lambda=0,\\\\\n    \\lambda\\inf A, & \\lambda<0.\n\
    \  \\end{cases}\n\\]\n\\hyperref[prf:supremum-dilation]{Go to proof.}\n\\end{theorem}"
