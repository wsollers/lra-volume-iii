statement:
  canonical_prose: Subset Inclusion Preserves Lower Bounds
  canonical_latex: "\\begin{lemma}[Subset Inclusion Preserves Lower Bounds]\n\\label{lem:subset-inclusion-preserves-lower-bounds}\n\
    Let $(S,\\leq)$ be a partially ordered set, let $A,B\\subseteq S$, and suppose\n\
    that $A\\subseteq B$. If $\\ell\\in S$ is a lower bound of $B$, then $\\ell$ is\n\
    a lower bound of $A$; equivalently,\n\\[\n  \\left[(\\forall b\\in B)(\\ell\\\
    leq b)\\right]\n  \\Longrightarrow\n  \\left[(\\forall a\\in A)(\\ell\\leq a)\\\
    right].\n\\]\n\n\\hyperref[prf:subset-inclusion-preserves-lower-bounds]{Go to\
    \ proof.}\n\\end{lemma}"
