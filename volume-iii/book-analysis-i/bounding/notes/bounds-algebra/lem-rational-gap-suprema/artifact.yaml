statement:
  canonical_prose: Rational Gap Example for Suprema
  canonical_latex: "\\begin{lemma}[Rational Gap Example for Suprema]\n\\label{lem:rational-gap-suprema}\n\
    Let\n\\[\n  A=\\{q\\in\\mathbb{Q}:q^2<2\\}.\n\\]\nThen $A$ is nonempty and bounded\
    \ above relative to $\\mathbb{Q}$, but $A$ has\nno supremum in $\\mathbb{Q}$:\n\
    \\[\n  \\nexists s\\in\\mathbb{Q}\\left[\n  (\\forall q\\in A)(q\\leq s)\n  \\\
    land\n  \\forall u\\in\\mathbb{Q}\n  \\bigl((\\forall q\\in A)(q\\leq u)\\Longrightarrow\
    \ s\\leq u\\bigr)\n  \\right].\n\\]\nWhen $A$ is regarded as a subset of $\\mathbb{R}$,\
    \ its supremum exists and is\n\\[\n  \\sup_{\\mathbb{R}}A=\\sqrt{2}.\n\\]\n\\\
    hyperref[prf:rational-gap-suprema]{Go to proof.}\n\\end{lemma}"
