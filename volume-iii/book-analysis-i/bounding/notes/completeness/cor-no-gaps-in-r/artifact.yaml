statement:
  canonical_prose: No Gaps in $\mathbb{R}$
  canonical_latex: "\\begin{corollary}[No Gaps in $\\mathbb{R}$]\n\\label{cor:no-gaps-in-r}\n\
    Let $L,U\\subseteq\\mathbb{R}$ be nonempty sets satisfying\n\\[\n  L\\cap U=\\\
    varnothing,\n  \\qquad\n  L\\cup U=\\mathbb{R},\n\\]\nand\n\\[\n  (\\forall \\\
    ell\\in L)(\\forall u\\in U)(\\ell<u).\n\\]\nThen there exists a unique $c\\in\\\
    mathbb{R}$ such that exactly one of the\nfollowing alternatives holds:\n\\[\n\
    \  L=\\{x\\in\\mathbb{R}:x<c\\},\n  \\qquad\n  U=\\{x\\in\\mathbb{R}:c\\leq x\\\
    },\n\\]\nor\n\\[\n  L=\\{x\\in\\mathbb{R}:x\\leq c\\},\n  \\qquad\n  U=\\{x\\\
    in\\mathbb{R}:c<x\\}.\n\\]\nThus every Dedekind cut of $\\mathbb{R}$ is determined\
    \ by a real number.\n\\hyperref[prf:no-gaps-in-r]{Go to proof.}\n\\end{corollary}"
