statement:
  canonical_prose: Infimum of a Reciprocal Set
  canonical_latex: "\\begin{theorem}[Infimum of a Reciprocal Set]\n\\label{thm:infimum-reciprocal-set}\n\
    Let $A\\subseteq\\mathbb{R}$ be nonempty and bounded, and suppose that\n$0<\\\
    inf A$ or $\\sup A<0$.  Define\n\\[\n  A^{-1}:=\\{1/a:a\\in A\\}.\n\\]\nThen $A^{-1}$\
    \ is bounded below, and\n\\[\n  \\inf(A^{-1})=\\frac{1}{\\sup A}.\n\\]\n\\hyperref[prf:infimum-reciprocal-set]{Go\
    \ to proof.}\n\\end{theorem}"
