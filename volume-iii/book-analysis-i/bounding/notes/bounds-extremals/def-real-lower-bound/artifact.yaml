  canonical_latex: "\\begin{definition}[Lower Bound in the Real Line]\n\\label{def:real-lower-bound}\n\
    Let $A\\subseteq\\mathbb{R}$ and let $\\ell\\in\\mathbb{R}$. The number $\\ell$\n\
    is a \\emph{lower bound} of $A$ if\n\\[\n  (\\forall a\\in A)(\\ell\\leq a).\n\
    \\]\n\\end{definition}"
