statement:
  canonical_prose: Decreasing Inverse Sends Infimum to Supremum
  canonical_latex: "\\begin{theorem}[Decreasing Inverse Sends Infimum to Supremum]\n\
    \\label{thm:decreasing-inverse-infimum-to-supremum}\nLet $I,J\\subseteq\\mathbb{R}$\
    \ be intervals, and let $f\\colon I\\to J$ be a continuous\nstrictly decreasing\
    \ bijection.  Let $B\\subseteq J$ be nonempty and bounded\nbelow, and suppose\
    \ $\\inf B\\in J$.  Then\n$f^{-1}[B]:=\\{f^{-1}(b):b\\in B\\}$ is bounded above,\
    \ and\n\\[\n  \\sup f^{-1}[B]=f^{-1}(\\inf B).\n\\]\n\\hyperref[prf:decreasing-inverse-infimum-to-supremum]{Go\
    \ to proof.}\n\\end{theorem}"
