statement:
  canonical_prose: Least Upper Bound Property Implies Monotone Convergence
  canonical_latex: "\\begin{theorem}[Least Upper Bound Property Implies Monotone Convergence]\n\
    \\label{thm:lub-property-implies-monotone-convergence}\nLet $F$ be a linearly\
    \ ordered field satisfying the least upper bound property.\nLet $(x_n)_{n\\in\\\
    mathbb{N}}$ be a sequence in $F$.  If\n\\[\n  (\\forall n\\in\\mathbb{N})(x_n\\\
    leq x_{n+1})\n\\]\nand\n\\[\n  (\\exists M\\in F)(\\forall n\\in\\mathbb{N})(x_n\\\
    leq M),\n\\]\nthen the set\n\\[\n  X:=\\{x_n:n\\in\\mathbb{N}\\}\n\\]\nhas a supremum\
    \ $s\\in F$, and\n\\[\n  (\\forall\\varepsilon\\in F)\\left[\n  \\varepsilon>0\n\
    \  \\Longrightarrow\n  (\\exists N\\in\\mathbb{N})(\\forall n\\in\\mathbb{N})\n\
    \  \\bigl(n\\geq N\\Longrightarrow |x_n-s|<\\varepsilon\\bigr)\n  \\right].\n\\\
    ]\nConsequently,\n\\[\n  \\lim_{n\\longrightarrow\\infty}x_n=s=\\sup\\{x_n:n\\\
    in\\mathbb{N}\\}.\n\\]\nDually, if\n\\[\n  (\\forall n\\in\\mathbb{N})(x_{n+1}\\\
    leq x_n)\n\\]\nand\n\\[\n  (\\exists m\\in F)(\\forall n\\in\\mathbb{N})(m\\leq\
    \ x_n),\n\\]\nthen\n\\[\n  \\lim_{n\\longrightarrow\\infty}x_n=\\inf\\{x_n:n\\\
    in\\mathbb{N}\\}.\n\\]\n\n\\smallskip\n\\noindent\n\\hyperref[prf:lub-property-implies-monotone-convergence]{\\\
    textit{Go to proof.}}\n\\end{theorem}"
