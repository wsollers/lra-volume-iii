statement:
  canonical_prose: Order Separation by Supremum
  canonical_latex: "\\begin{theorem}[Order Separation by Supremum]\n\\label{thm:order-separation-by-supremum}\n\
    Let $A,B\\subseteq\\mathbb{R}$ be nonempty sets such that\n\\[\n  (\\forall a\\\
    in A)(\\forall b\\in B)(a\\leq b).\n\\]\nThen $A$ is bounded above, $B$ is bounded\
    \ below, and the real number\n$c:=\\sup A$ separates $A$ from $B$; that is,\n\\\
    [\n  (\\forall a\\in A)(\\forall b\\in B)(a\\leq c\\leq b).\n\\]\nIn particular,\n\
    \\[\n  \\sup A\\leq\\inf B.\n\\]\n\\hyperref[prf:order-separation-by-supremum]{Go\
    \ to proof.}\n\\end{theorem}"
