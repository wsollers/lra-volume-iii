  canonical_latex: "\\begin{theorem}[Negation Exchanges Supremum and Infimum]\n\\\
    label{thm:negation-exchange-sup-inf}\nLet $A\\subseteq\\mathbb{R}$ be nonempty\
    \ and bounded below.  Then\n$-A:=\\{-a:a\\in A\\}$ is nonempty and bounded above,\
