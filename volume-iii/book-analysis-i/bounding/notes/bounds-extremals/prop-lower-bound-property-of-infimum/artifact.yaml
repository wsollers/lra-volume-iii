  canonical_prose: Lower-Bound Property of the Infimum
  canonical_latex: "\\begin{proposition}[Lower-Bound Property of the Infimum]\n\\\
    label{prop:lower-bound-property-of-infimum}\nLet $(S,\\leq)$ be a partially ordered\
    \ set, let $A\\subseteq S$, and suppose\nthat $i=\\inf A$ exists in $S$. Then\
    \ $i$ is a lower bound of $A$; that is,\n\\[\n  (\\forall x\\in A)(i\\leq x).\n\
    \\]\n\n\\hyperref[prf:lower-bound-property-of-infimum]{Go to proof.}\n\\end{proposition}"
