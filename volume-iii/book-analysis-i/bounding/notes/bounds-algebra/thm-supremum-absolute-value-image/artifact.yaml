  canonical_prose: Supremum of the Absolute-Value Image
  canonical_latex: "\\begin{theorem}[Supremum of the Absolute-Value Image]\n\\label{thm:supremum-absolute-value-image}\n\
    Let $A\\subseteq\\mathbb{R}$ be nonempty and bounded.  Then\n$|A|:=\\{|a|:a\\\
    in A\\}$ is nonempty and bounded above, and\n\\[\n  \\sup |A|=\\max\\{|\\inf A|,|\\\
    sup A|\\}.\n\\]\n\\hyperref[prf:supremum-absolute-value-image]{Go to proof.}\n\
    \\end{theorem}"
