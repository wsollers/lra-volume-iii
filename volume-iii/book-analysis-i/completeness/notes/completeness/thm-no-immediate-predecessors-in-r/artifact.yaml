statement:
  canonical_prose: No Immediate Predecessors in $\mathbb{R}$
  canonical_latex: "\\begin{theorem}[No Immediate Predecessors in $\\mathbb{R}$]\\\
    label{thm:no-immediate-predecessors-in-r}\nFor every $a\\in\\mathbb{R}$, there\
    \ is no greatest real number less than $a$:\n\\[\n  \\neg(\\exists m\\in\\mathbb{R})\n\
    \  \\left[\n  m<a\n  \\land\n  (\\forall x\\in\\mathbb{R})(x<a\\Longrightarrow\
    \ x\\leq m)\n  \\right].\n\\]\n\\hyperref[prf:no-immediate-predecessors-in-r]{Go\
    \ to proof.}\n\\end{theorem}"
