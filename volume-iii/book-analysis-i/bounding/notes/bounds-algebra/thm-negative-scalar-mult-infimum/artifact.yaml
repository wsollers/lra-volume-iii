statement:
  canonical_prose: Negative Scalar Multiplication of the Infimum
  canonical_latex: "\\begin{theorem}[Negative Scalar Multiplication of the Infimum]\n\
    \\label{thm:negative-scalar-mult-infimum}\nLet $A\\subseteq\\mathbb{R}$ be nonempty\
    \ and bounded above, and let\n$k\\in\\mathbb{R}$ satisfy $k<0$.  Then $kA:=\\\
    {ka:a\\in A\\}$ is nonempty and\nbounded below, and\n\\[\n  \\inf(kA)=k\\sup A.\n\
    \\]\n\\hyperref[prf:negative-scalar-mult-infimum]{Go to proof.}\n\\end{theorem}"
