statement:
  canonical_prose: Greatest-Lower-Bound Property Implies Existence of Infima
  canonical_latex: "\\begin{theorem}[Greatest-Lower-Bound Property Implies Existence\
    \ of Infima]\n\\label{thm:glb-property-implies-existence-of-infima}\nLet $A\\\
    subseteq\\mathbb{R}$ be nonempty and bounded below. Then there\nexists a unique\
    \ $i\\in\\mathbb{R}$ such that\n\\[\n  i=\\inf A.\n\\]\nEquivalently,\n\\[\n \
    \ (\\forall A\\subseteq\\mathbb{R})\n  \\left[\n    A\\neq\\varnothing\n    \\\
    land\n    (\\exists \\ell\\in\\mathbb{R})(\\forall a\\in A)(\\ell\\leq a)\n  \
    \  \\Longrightarrow\n    (\\exists!i\\in\\mathbb{R})(i=\\inf A)\n  \\right].\n\
    \\]\n\n\\hyperref[prf:glb-property-implies-existence-of-infima]{Go to proof.}\n\
    \\end{theorem}"
