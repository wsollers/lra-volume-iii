statement:
  canonical_prose: Scalar Multiplication by a Positive Scalar
  canonical_latex: "\\begin{theorem}[Scalar Multiplication by a Positive Scalar]\n\
    \\label{thm:scalar-mult-positive}\nLet $A\\subseteq\\mathbb{R}$ be nonempty and\
    \ bounded above, and let\n$k\\in\\mathbb{R}$ satisfy $k>0$.  Then $kA:=\\{ka:a\\\
    in A\\}$ is nonempty and\nbounded above, and\n\\[\n  \\sup(kA)=k\\sup A.\n\\]\n\
    \\hyperref[prf:scalar-mult-positive]{Go to proof.}\n\\end{theorem}"
