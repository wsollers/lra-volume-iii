statement:
  canonical_prose: Bound
  canonical_latex: "\\begin{definition}[Bound]\n\\label{def:bound}\nLet $(S,\\leq)$\
    \ be a partially ordered set, let $A\\subseteq S$, and let\n$b\\in S$. The element\
    \ $b$ is a \\emph{bound} of $A$ if it is either an\nupper bound or a lower bound\
    \ of $A$; equivalently,\n\\[\n  \\bigl[(\\forall a\\in A)(a\\leq b)\\bigr]\n \
    \ \\lor\n  \\bigl[(\\forall a\\in A)(b\\leq a)\\bigr].\n\\]\n\\end{definition}"
