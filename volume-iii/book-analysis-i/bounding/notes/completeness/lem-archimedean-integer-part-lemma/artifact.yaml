statement:
  canonical_prose: Archimedean Integer Part Lemma
  canonical_latex: "\\begin{lemma}[Archimedean Integer Part Lemma]\n\\label{lem:archimedean-integer-part-lemma}\n\
    For every $x\\in\\mathbb{R}$, there exists a unique integer $m\\in\\mathbb{Z}$\n\
    such that\n\\[\n  m\\leq x<m+1.\n\\]\nEquivalently,\n\\[\n  (\\forall x\\in\\\
    mathbb{R})(\\exists!m\\in\\mathbb{Z})(m\\leq x<m+1).\n\\]\n\n\\smallskip\n\\noindent\n\
    \\hyperref[prf:archimedean-integer-part-lemma]{\\textit{Go to proof.}}\n\\end{lemma}"
