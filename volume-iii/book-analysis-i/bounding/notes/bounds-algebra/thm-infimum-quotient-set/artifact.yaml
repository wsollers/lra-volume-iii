statement:
  canonical_prose: Infimum of a Quotient Set
  canonical_latex: "\\begin{theorem}[Infimum of a Quotient Set]\n\\label{thm:infimum-quotient-set}\n\
    Let $A,B\\subseteq\\mathbb{R}$ be nonempty and bounded, and suppose\n$0<\\inf\
    \ B$ or $\\sup B<0$.  Then\n$A/B:=\\{a/b:a\\in A,\\ b\\in B\\}$ is bounded, and\n\
    \\[\n  \\inf(A/B)=\n  \\min\\left\\{\\frac{\\inf A}{\\inf B},\\frac{\\inf A}{\\\
    sup B},\n              \\frac{\\sup A}{\\inf B},\\frac{\\sup A}{\\sup B}\\right\\\
    }.\n\\]\n\\hyperref[prf:infimum-quotient-set]{Go to proof.}\n\\end{theorem}"
