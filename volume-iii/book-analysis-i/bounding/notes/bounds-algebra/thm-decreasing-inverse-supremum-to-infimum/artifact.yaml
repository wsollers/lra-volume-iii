statement:
  canonical_prose: Decreasing Inverse Sends Supremum to Infimum
  canonical_latex: "\\begin{theorem}[Decreasing Inverse Sends Supremum to Infimum]\n\
    \\label{thm:decreasing-inverse-supremum-to-infimum}\nLet $I,J\\subseteq\\mathbb{R}$\
    \ be intervals, and let $f\\colon I\\to J$ be a continuous\nstrictly decreasing\
    \ bijection.  Let $B\\subseteq J$ be nonempty and bounded\nabove, and suppose\
    \ $\\sup B\\in J$.  Then\n$f^{-1}[B]:=\\{f^{-1}(b):b\\in B\\}$ is bounded below,\
    \ and\n\\[\n  \\inf f^{-1}[B]=f^{-1}(\\sup B).\n\\]\n\\hyperref[prf:decreasing-inverse-supremum-to-infimum]{Go\
    \ to proof.}\n\\end{theorem}"
