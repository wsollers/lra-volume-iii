statement:
  canonical_prose: The Reciprocal Sequence Converges to Zero
  canonical_latex: "\\begin{corollary}[The Reciprocal Sequence Converges to Zero]\n\
    \\label{cor:archimedean-reciprocal}\nFor every $\\varepsilon\\in\\mathbb{R}$ with\
    \ $\\varepsilon>0$, there exists\n$N\\in\\mathbb{N}$ such that, for every $n\\\
    in\\mathbb{N}$,\n\\[\n  n\\geq N\n  \\Longrightarrow\n  \\left|\\frac{1}{n}-0\\\
    right|<\\varepsilon.\n\\]\nHence,\n\\[\n  \\lim_{n\\longrightarrow\\infty}\\frac{1}{n}=0.\n\
    \\]\n\n\\smallskip\n\\noindent\n\\hyperref[prf:archimedean-reciprocal]{\\textit{Go\
    \ to proof.}}\n\\end{corollary}"
