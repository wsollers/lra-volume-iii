statement:
  canonical_prose: Decreasing Image Sends Infimum to Supremum
  canonical_latex: "\\begin{theorem}[Decreasing Image Sends Infimum to Supremum]\n\
    \\label{thm:decreasing-image-infimum-to-supremum}\nLet $I\\subseteq\\mathbb{R}$\
    \ be an interval, let $A\\subseteq I$ be nonempty and\nbounded below, and suppose\
    \ $i:=\\inf A\\in I$.  If $f\\colon I\\to\\mathbb{R}$ is\ndecreasing and continuous\
    \ at $i$ relative to $I$, then\n$f[A]:=\\{f(a):a\\in A\\}$ is bounded above, and\n\
    \\[\n  \\sup f[A]=f(\\inf A).\n\\]\n\\hyperref[prf:decreasing-image-infimum-to-supremum]{Go\
    \ to proof.}\n\\end{theorem}"
