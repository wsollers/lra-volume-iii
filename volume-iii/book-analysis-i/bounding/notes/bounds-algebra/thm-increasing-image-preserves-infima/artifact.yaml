statement:
  canonical_prose: Increasing Image Preserves Infima
  canonical_latex: "\\begin{theorem}[Increasing Image Preserves Infima]\n\\label{thm:increasing-image-preserves-infima}\n\
    Let $I\\subseteq\\mathbb{R}$ be an interval, let $A\\subseteq I$ be nonempty and\n\
    bounded below, and suppose $i:=\\inf A\\in I$.  If $f\\colon I\\to\\mathbb{R}$\
    \ is\nincreasing and continuous at $i$ relative to $I$, then\n$f[A]:=\\{f(a):a\\\
    in A\\}$ is bounded below, and\n\\[\n  \\inf f[A]=f(\\inf A).\n\\]\n\\hyperref[prf:increasing-image-preserves-infima]{Go\
    \ to proof.}\n\\end{theorem}"
