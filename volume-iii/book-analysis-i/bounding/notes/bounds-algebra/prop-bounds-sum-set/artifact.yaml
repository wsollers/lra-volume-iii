statement:
  canonical_prose: Bounds for Suprema and Infima Under Set Addition
  canonical_latex: "\\begin{proposition}[Bounds for Suprema and Infima Under Set Addition]\n\
    \\label{prop:bounds-sum-set}\nLet $A,B\\subseteq\\mathbb{R}$, and let\n$u_A,u_B,\\\
    ell_A,\\ell_B\\in\\mathbb{R}$.  If $u_A$ is an upper bound of $A$ and\n$u_B$ is\
    \ an upper bound of $B$, then $u_A+u_B$ is an upper bound of $A+B$:\n\\[\n  \\\
    left[(\\forall a\\in A)(a\\leq u_A)\\land\n  (\\forall b\\in B)(b\\leq u_B)\\\
    right]\n  \\Longrightarrow\n  (\\forall x\\in A+B)(x\\leq u_A+u_B).\n\\]\nIf $\\\
    ell_A$ is a lower bound of $A$ and $\\ell_B$ is a lower bound of $B$, then\n$\\\
    ell_A+\\ell_B$ is a lower bound of $A+B$:\n\\[\n  \\left[(\\forall a\\in A)(\\\
    ell_A\\leq a)\\land\n  (\\forall b\\in B)(\\ell_B\\leq b)\\right]\n  \\Longrightarrow\n\
    \  (\\forall x\\in A+B)(\\ell_A+\\ell_B\\leq x).\n\\]\n\\hyperref[prf:bounds-sum-set]{Go\
    \ to proof.}\n\\end{proposition}"
