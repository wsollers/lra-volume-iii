statement:
  canonical_prose: Monotone Convergence Implies Least Upper Bound Property
  canonical_latex: "\\begin{theorem}[Monotone Convergence Implies Least Upper Bound\
    \ Property]\n\\label{thm:monotone-convergence-implies-lub-property}\nLet $F$ be\
    \ an Archimedean linearly ordered field.  Suppose that every\nincreasing sequence\
    \ in $F$ that is bounded above converges in $F$; explicitly,\nsuppose that for\
    \ every sequence $(x_n)_{n\\in\\mathbb{N}}$ in $F$,\n\\[\n  \\left[(\\forall n\\\
    in\\mathbb{N})(x_n\\leq x_{n+1})\\right]\n  \\land\n  \\left[(\\exists M\\in F)(\\\
    forall n\\in\\mathbb{N})(x_n\\leq M)\\right]\n\\]\nimplies that there exists $L\\\
    in F$ such that\n\\[\n  (\\forall\\varepsilon\\in F)\\left[\n  \\varepsilon>0\n\
    \  \\Longrightarrow\n  (\\exists N\\in\\mathbb{N})(\\forall n\\in\\mathbb{N})\n\
    \  \\bigl(n\\geq N\\Longrightarrow |x_n-L|<\\varepsilon\\bigr)\n  \\right].\n\\\
    ]\nThen $F$ has the least upper bound property.  That is, for every\n$A\\subseteq\
    \ F$,\n\\[\n  \\left[\n  A\\neq\\varnothing\n  \\land\n  (\\exists u\\in F)(\\\
    forall a\\in A)(a\\leq u)\n  \\right]\n\\]\nimplies that there exists $s\\in F$\
    \ satisfying\n\\[\n  (\\forall a\\in A)(a\\leq s)\n\\]\nand\n\\[\n  (\\forall\
    \ u\\in F)\\left[\n  (\\forall a\\in A)(a\\leq u)\n  \\Longrightarrow\n  s\\leq\
    \ u\n  \\right].\n\\]\n\n\\smallskip\n\\noindent\n\\hyperref[prf:monotone-convergence-implies-lub-property]{\\\
    textit{Go to proof.}}\n\\end{theorem}"
