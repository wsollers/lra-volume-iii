statement:
  canonical_prose: Upper Bounds Depend on the Ambient Order
  canonical_latex: "\\begin{proposition}[Upper Bounds Depend on the Ambient Order]\n\
    \\label{prop:upper-bounds-ambient-order}\nLet $(P,\\leq)$ be a partially ordered\
    \ set, and let\n$A\\subseteq S\\subseteq S'\\subseteq P$.  The upper bounds of\
    \ $A$ relative to\n$S$ are exactly those upper bounds of $A$ relative to $S'$\
    \ that belong to $S$:\n\\[\n  \\{u\\in S:(\\forall a\\in A)(a\\leq u)\\}\n  =\n\
    \  S\\cap\\{u\\in S':(\\forall a\\in A)(a\\leq u)\\}.\n\\]\n\\hyperref[prf:upper-bounds-ambient-order]{Go\
    \ to proof.}\n\\end{proposition}"
