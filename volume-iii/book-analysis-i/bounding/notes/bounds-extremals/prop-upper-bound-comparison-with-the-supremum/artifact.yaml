statement:
  canonical_prose: Upper-Bound Comparison with the Supremum
  canonical_latex: "\\begin{proposition}[Upper-Bound Comparison with the Supremum]\n\
    \\label{prop:upper-bound-comparison-with-the-supremum}\nLet $A\\subseteq\\mathbb{R}$\
    \ be nonempty and bounded above, and let\n$s=\\sup A$. For every $u\\in\\mathbb{R}$,\n\
    \\[\n  u\\text{ is an upper bound of }A\n  \\Longleftrightarrow\n  s\\leq u.\n\
    \\]\nEquivalently,\n\\[\n  (\\forall a\\in A)(a\\leq u)\n  \\Longleftrightarrow\n\
    \  s\\leq u.\n\\]\n\n\\hyperref[prf:upper-bound-comparison-with-the-supremum]{Go\
    \ to proof.}\n\\end{proposition}"
