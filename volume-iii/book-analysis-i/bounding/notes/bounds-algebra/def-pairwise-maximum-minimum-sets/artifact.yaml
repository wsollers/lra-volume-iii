  canonical_latex: "\\begin{definition}[Pairwise Maximum and Minimum Sets]\n\\label{def:pairwise-maximum-minimum-sets}\n\
    Let $A,B\\subseteq\\mathbb{R}$.  The \\emph{pairwise maximum set} and\n\\emph{pairwise\
    \ minimum set} of $A$ and $B$ are defined, respectively, by\n\\[\n  A\\vee B:=\\\
    {\\max\\{a,b\\}:a\\in A,\\ b\\in B\\},\n\\]\nand\n\\[\n  A\\wedge B:=\\{\\min\\\
    {a,b\\}:a\\in A,\\ b\\in B\\}.\n\\]\n\\end{definition}"
