statement:
  canonical_prose: Integer Ceiling Lemma
  canonical_latex: "\\begin{lemma}[Integer Ceiling Lemma]\n\\label{lem:integer-ceiling-lemma}\n\
    For every $x\\in\\mathbb{R}$, there exists a unique $m\\in\\mathbb{Z}$ such that\n\
    \\[\n  m-1<x\\leq m.\n\\]\nEquivalently,\n\\[\n  (\\forall x\\in\\mathbb{R})(\\\
    exists!m\\in\\mathbb{Z})(m-1<x\\leq m).\n\\]\nThe unique integer $m$ is denoted\
    \ by\n\\[\n  m=\\lceil x\\rceil.\n\\]\n\n\\smallskip\n\\noindent\n\\hyperref[prf:integer-ceiling-lemma]{\\\
    textit{Go to proof.}}\n\\end{lemma}"
