statement:
  canonical_prose: Supremum of a Quotient Set
  canonical_latex: "\\begin{theorem}[Supremum of a Quotient Set]\n\\label{thm:supremum-quotient-set}\n\
    Let $A,B\\subseteq\\mathbb{R}$ be nonempty and bounded, and suppose\n$0<\\inf\
    \ B$ or $\\sup B<0$.  Then\n$A/B:=\\{a/b:a\\in A,\\ b\\in B\\}$ is bounded, and\n\
    \\[\n  \\sup(A/B)=\n  \\max\\left\\{\\frac{\\inf A}{\\inf B},\\frac{\\inf A}{\\\
    sup B},\n              \\frac{\\sup A}{\\inf B},\\frac{\\sup A}{\\sup B}\\right\\\
    }.\n\\]\n\\hyperref[prf:supremum-quotient-set]{Go to proof.}\n\\end{theorem}"
