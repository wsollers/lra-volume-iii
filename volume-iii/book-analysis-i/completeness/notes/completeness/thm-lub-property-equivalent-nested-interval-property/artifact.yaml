statement:
  canonical_prose: Least Upper Bound Property Equivalent to Nested Intervals
  canonical_latex: "\\begin{theorem}[Least Upper Bound Property Equivalent to Nested\
    \ Intervals]\n\\label{thm:lub-property-equivalent-nested-interval-property}\n\
    Let $F$ be an Archimedean linearly ordered field.  The following statements are\n\
    equivalent:\n\\begin{enumerate}[label=(\\roman*)]\n  \\item Every nonempty subset\
    \ of $F$ that is bounded above has a least upper\n  bound in $F$.\n  \\item For\
    \ every pair of sequences $(a_n)$ and $(b_n)$ in $F$ satisfying\n  \\[\n    (\\\
    forall n\\in\\mathbb{N})(a_n\\leq b_n)\n  \\]\n  and\n  \\[\n    (\\forall n\\\
    in\\mathbb{N})([a_{n+1},b_{n+1}]\\subseteq [a_n,b_n]),\n  \\]\n  there exists\
    \ $x\\in F$ such that\n  \\[\n    (\\forall n\\in\\mathbb{N})(a_n\\leq x\\leq\
    \ b_n).\n  \\]\n  Equivalently,\n  \\[\n    \\bigcap_{n=1}^{\\infty}[a_n,b_n]\\\
    neq\\varnothing.\n  \\]\n\\end{enumerate}\n\n\\smallskip\n\\noindent\n\\hyperref[prf:lub-property-equivalent-nested-interval-property]{\\\
    textit{Go to proof.}}\n\\end{theorem}"
