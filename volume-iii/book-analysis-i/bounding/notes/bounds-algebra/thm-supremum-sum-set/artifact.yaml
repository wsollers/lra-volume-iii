statement:
  canonical_prose: Supremum of a Sum Set
  canonical_latex: "\\begin{theorem}[Supremum of a Sum Set]\n\\label{thm:supremum-sum-set}\n\
    Let $A,B\\subseteq\\mathbb{R}$ be nonempty and bounded above.  Then\n$A+B:=\\\
    {a+b:a\\in A,\\ b\\in B\\}$ is nonempty and bounded above, and\n\\[\n  \\sup(A+B)=\\\
    sup A+\\sup B.\n\\]\n\n\\smallskip\n\\noindent\n\\hyperref[prf:supremum-sum-set]{\\\
    textit{Go to proof.}}\n\\end{theorem}"
