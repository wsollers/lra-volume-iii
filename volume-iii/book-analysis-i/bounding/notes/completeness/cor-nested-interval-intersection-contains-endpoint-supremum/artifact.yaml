  canonical_prose: Nested Interval Intersection Contains the Endpoint Supremum
  canonical_latex: "\\begin{corollary}[Nested Interval Intersection Contains the Endpoint\
    \ Supremum]\n\\label{cor:nested-interval-intersection-contains-endpoint-supremum}\n\
    Let $(a_n)$ and $(b_n)$ satisfy the hypotheses of the Nested Interval Theorem,\n\
    and define\n\\[\n  \\alpha:=\\sup\\{a_n:n\\in\\mathbb{N}\\}.\n\\]\nThen\n\\[\n\
    \  (\\forall n\\in\\mathbb{N})(a_n\\leq\\alpha\\leq b_n).\n\\]\nTherefore,\n\\\
    [\n  \\alpha\\in \\bigcap_{n=1}^{\\infty}[a_n,b_n].\n\\]\n\\hyperref[prf:nested-interval-intersection-contains-endpoint-supremum]{Go\
    \ to proof.}\n\\end{corollary}"
