statement:
  canonical_prose: Translation Invariance of the Supremum
  canonical_latex: "\\begin{theorem}[Translation Invariance of the Supremum]\n\\label{thm:translation-invariance-supremum}\n\
    Let $A\\subseteq\\mathbb{R}$ be nonempty and bounded above, and let\n$c\\in\\\
    mathbb{R}$.  Then $A+c:=\\{a+c:a\\in A\\}$ is nonempty and bounded above,\nand\n\
    \\[\n  \\sup(A+c)=\\sup A+c.\n\\]\n\\hyperref[prf:translation-invariance-supremum]{Go\
    \ to proof.}\n\\end{theorem}"
