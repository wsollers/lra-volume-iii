statement:
  canonical_prose: No Immediate Successors in $\mathbb{R}$
  canonical_latex: "\\begin{theorem}[No Immediate Successors in $\\mathbb{R}$]\\label{thm:no-immediate-successors-in-r}\n\
    For every $a\\in\\mathbb{R}$, there is no least real number greater than $a$:\n\
    \\[\n  \\neg(\\exists m\\in\\mathbb{R})\n  \\left[\n  a<m\n  \\land\n  (\\forall\
    \ x\\in\\mathbb{R})(a<x\\Longrightarrow m\\leq x)\n  \\right].\n\\]\n\\hyperref[prf:no-immediate-successors-in-r]{Go\
    \ to proof.}\n\\end{theorem}"
