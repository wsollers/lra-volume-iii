statement:
  canonical_prose: Decreasing Image Sends Supremum to Infimum
  canonical_latex: "\\begin{theorem}[Decreasing Image Sends Supremum to Infimum]\n\
    \\label{thm:decreasing-image-supremum-to-infimum}\nLet $I\\subseteq\\mathbb{R}$\
    \ be an interval, let $A\\subseteq I$ be nonempty and\nbounded above, and suppose\
    \ $s:=\\sup A\\in I$.  If $f\\colon I\\to\\mathbb{R}$ is\ndecreasing and continuous\
    \ at $s$ relative to $I$, then\n$f[A]:=\\{f(a):a\\in A\\}$ is bounded below, and\n\
    \\[\n  \\inf f[A]=f(\\sup A).\n\\]\n\\hyperref[prf:decreasing-image-supremum-to-infimum]{Go\
    \ to proof.}\n\\end{theorem}"
