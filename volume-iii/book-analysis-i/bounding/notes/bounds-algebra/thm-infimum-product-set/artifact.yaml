statement:
  canonical_prose: Infimum of a Product Set
  canonical_latex: "\\begin{theorem}[Infimum of a Product Set]\n\\label{thm:infimum-product-set}\n\
    Let $A,B\\subseteq\\mathbb{R}$ be nonempty and bounded.  Then\n$AB:=\\{ab:a\\\
    in A,\\ b\\in B\\}$ is bounded, and\n\\[\n  \\inf(AB)=\n  \\min\\{(\\inf A)(\\\
    inf B),(\\inf A)(\\sup B),(\\sup A)(\\inf B),(\\sup A)(\\sup B)\\}.\n\\]\n\\hyperref[prf:infimum-product-set]{Go\
    \ to proof.}\n\\end{theorem}"
