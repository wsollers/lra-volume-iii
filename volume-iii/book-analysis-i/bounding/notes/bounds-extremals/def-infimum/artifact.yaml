statement:
  canonical_prose: Infimum
  canonical_latex: "\\begin{definition}[Infimum]\n\\label{def:infimum}\nLet $(S,\\\
    leq)$ be a partially ordered set, let $A\\subseteq S$, and let\n$i\\in S$. The\
    \ element $i$ is the \\emph{infimum} of $A$, written\n$i=\\inf A$, if\n\\[\n \
    \ (\\forall a\\in A)(i\\leq a)\n\\]\nand\n\\[\n  (\\forall \\ell\\in S)\n  \\\
    left[\n    (\\forall a\\in A)(\\ell\\leq a)\n    \\Longrightarrow\n    \\ell\\\
    leq i\n  \\right].\n\\]\nThus, $i$ is the greatest lower bound of $A$ in $S$.\n\
    \\end{definition}"
