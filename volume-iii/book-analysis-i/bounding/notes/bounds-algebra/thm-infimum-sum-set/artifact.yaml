statement:
  canonical_prose: Infimum of a Sum Set
  canonical_latex: "\\begin{theorem}[Infimum of a Sum Set]\n\\label{thm:infimum-sum-set}\n\
    Let $A,B\\subseteq\\mathbb{R}$ be nonempty and bounded below.  Then\n$A+B:=\\\
    {a+b:a\\in A,\\ b\\in B\\}$ is nonempty and bounded below, and\n\\[\n  \\inf(A+B)=\\\
    inf A+\\inf B.\n\\]\n\\hyperref[prf:infimum-sum-set]{Go to proof.}\n\\end{theorem}"
