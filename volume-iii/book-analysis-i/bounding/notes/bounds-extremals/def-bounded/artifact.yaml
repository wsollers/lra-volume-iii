statement:
  canonical_prose: Bounded Set
  canonical_latex: "\\begin{definition}[Bounded Set]\n\\label{def:bounded}\nLet $A\\\
    subseteq\\mathbb{R}$. The set $A$ is \\emph{bounded} if it is bounded\nabove and\
    \ bounded below; equivalently,\n\\[\n  (\\exists \\ell,u\\in\\mathbb{R})(\\forall\
    \ a\\in A)(\\ell\\leq a\\leq u).\n\\]\nEquivalently, $A$ is bounded if\n\\[\n\
    \  (\\exists M\\geq 0)(\\forall a\\in A)(|a|\\leq M).\n\\]\n\\end{definition}"
