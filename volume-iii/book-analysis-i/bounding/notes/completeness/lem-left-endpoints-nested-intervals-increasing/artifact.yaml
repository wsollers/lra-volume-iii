statement:
  canonical_prose: Left Endpoints of Nested Intervals Are Increasing
  canonical_latex: "\\begin{lemma}[Left Endpoints of Nested Intervals Are Increasing]\n\
    \\label{lem:left-endpoints-nested-intervals-increasing}\nLet $(a_n)$ and $(b_n)$\
    \ be sequences in $\\mathbb{R}$ such that\n\\[\n  (\\forall n\\in\\mathbb{N})(a_n\\\
    leq b_n)\n\\]\nand\n\\[\n  (\\forall n\\in\\mathbb{N})([a_{n+1},b_{n+1}]\\subseteq\
    \ [a_n,b_n]).\n\\]\nThen\n\\[\n  (\\forall n\\in\\mathbb{N})(a_n\\leq a_{n+1}).\n\
    \\]\n\\hyperref[prf:left-endpoints-nested-intervals-increasing]{Go to proof.}\n\
    \\end{lemma}"
