  canonical_prose: Scalar Multiplication by a Negative Scalar
  canonical_latex: "\\begin{theorem}[Scalar Multiplication by a Negative Scalar]\n\
    \\label{thm:scalar-mult-negative}\nLet $A\\subseteq\\mathbb{R}$ be nonempty and\
    \ bounded below, and let\n$k\\in\\mathbb{R}$ satisfy $k<0$.  Then $kA:=\\{ka:a\\\
    in A\\}$ is nonempty and\nbounded above, and\n\\[\n  \\sup(kA)=k\\inf A.\n\\]\n\
    \\hyperref[prf:scalar-mult-negative]{Go to proof.}\n\\end{theorem}"
