statement:
  canonical_prose: Increasing Inverse Preserves Infima
  canonical_latex: "\\begin{theorem}[Increasing Inverse Preserves Infima]\n\\label{thm:increasing-inverse-preserves-infima}\n\
    Let $I,J\\subseteq\\mathbb{R}$ be intervals, and let $f\\colon I\\to J$ be a continuous\n\
    strictly increasing bijection.  Let $B\\subseteq J$ be nonempty and bounded\n\
    below, and suppose $\\inf B\\in J$.  Then\n$f^{-1}[B]:=\\{f^{-1}(b):b\\in B\\\
    }$ is bounded below, and\n\\[\n  \\inf f^{-1}[B]=f^{-1}(\\inf B).\n\\]\n\\hyperref[prf:increasing-inverse-preserves-infima]{Go\
    \ to proof.}\n\\end{theorem}"
