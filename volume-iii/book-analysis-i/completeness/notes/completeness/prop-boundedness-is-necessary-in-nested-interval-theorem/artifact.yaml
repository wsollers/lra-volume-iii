  canonical_prose: Boundedness Is Necessary in the Nested Interval Theorem
  canonical_latex: "\\begin{proposition}[Boundedness Is Necessary in the Nested Interval\
    \ Theorem]\n\\label{prop:boundedness-is-necessary-in-nested-interval-theorem}\n\
    There exists a sequence $(I_n)_{n\\in\\mathbb{N}}$ of nonempty closed unbounded\n\
    intervals in $\\mathbb{R}$ such that\n\\[\n  (\\forall n\\in\\mathbb{N})(I_{n+1}\\\
    subseteq I_n),\n\\]\nbut\n\\[\n  \\bigcap_{n=1}^{\\infty}I_n=\\varnothing.\n\\\
    ]\nFor example,\n\\[\n  I_n=[n,\\infty).\n\\]\n\\hyperref[prf:boundedness-is-necessary-in-nested-interval-theorem]{Go\
    \ to proof.}\n\\end{proposition}"
