statement:
  canonical_prose: Ambient Existence of Supremum
  canonical_latex: "\\begin{theorem}[Ambient Existence of Supremum]\n\\label{thm:ambient-existence-supremum}\n\
    There exist a linearly ordered set $(P,\\leq)$ and subsets\n$A\\subseteq S\\subseteq\
    \ S'\\subseteq P$ such that $A$ has a supremum relative to\n$S'$ but has no supremum\
    \ relative to $S$.  For example, in $\\mathbb{R}$, let\n\\[\n  A=S=(0,1),\n  \\\
    qquad\n  S'=(0,1].\n\\]\nThen\n\\[\n  \\sup_{S'}A=1,\n\\]\nwhereas $A$ has no\
    \ upper bound in $S$, and hence no supremum relative to $S$.\n\\hyperref[prf:ambient-existence-supremum]{Go\
    \ to proof.}\n\\end{theorem}"
