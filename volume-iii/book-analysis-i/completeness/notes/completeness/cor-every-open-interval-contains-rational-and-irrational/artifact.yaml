  canonical_prose: Rational and Irrational Points in Every Open Interval
  canonical_latex: "\\begin{corollary}[Rational and Irrational Points in Every Open\
    \ Interval]\n\\label{cor:every-open-interval-contains-rational-and-irrational}\n\
    For every $a,b\\in\\mathbb{R}$ with $a<b$, there exist\n$q\\in\\mathbb{Q}$ and\
    \ $s\\in\\mathbb{R}\\setminus\\mathbb{Q}$ such that\n\\[\n  a<q<b\n  \\qquad\\\
    text{and}\\qquad\n  a<s<b.\n\\]\n\\hyperref[prf:every-open-interval-contains-rational-and-irrational]{Go\
    \ to proof.}\n\\end{corollary}"
