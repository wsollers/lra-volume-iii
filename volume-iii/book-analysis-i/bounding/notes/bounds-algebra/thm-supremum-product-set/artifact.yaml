statement:
  canonical_prose: Supremum of a Product Set
  canonical_latex: "\\begin{theorem}[Supremum of a Product Set]\n\\label{thm:supremum-product-set}\n\
    Let $A,B\\subseteq\\mathbb{R}$ be nonempty and bounded.  Then\n$AB:=\\{ab:a\\\
    in A,\\ b\\in B\\}$ is bounded, and\n\\[\n  \\sup(AB)=\n  \\max\\{(\\inf A)(\\\
    inf B),(\\inf A)(\\sup B),(\\sup A)(\\inf B),(\\sup A)(\\sup B)\\}.\n\\]\n\\hyperref[prf:supremum-product-set]{Go\
    \ to proof.}\n\\end{theorem}"
