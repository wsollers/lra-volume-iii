  canonical_prose: Integer Above Lemma
  canonical_latex: "\\begin{lemma}[Integer Above Lemma]\n\\label{lem:integer-above-lemma}\n\
    For every $x\\in\\mathbb{R}$, there exists $n\\in\\mathbb{N}$ such that\n\\[\n\
    \  x<n.\n\\]\nEquivalently,\n\\[\n  (\\forall x\\in\\mathbb{R})(\\exists n\\in\\\
    mathbb{N})(x<n).\n\\]\n\n\\smallskip\n\\noindent\n\\hyperref[prf:integer-above-lemma]{\\\
    textit{Go to proof.}}\n\\end{lemma}"
