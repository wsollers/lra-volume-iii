  canonical_prose: Upper-Bound Property of the Supremum
  canonical_latex: "\\begin{proposition}[Upper-Bound Property of the Supremum]\n\\\
    label{prop:upper-bound-property-of-supremum}\nLet $(S,\\leq)$ be a partially ordered\
    \ set, let $A\\subseteq S$, and suppose\nthat $s=\\sup A$ exists in $S$. Then\
    \ $s$ is an upper bound of $A$; that is,\n\\[\n  (\\forall x\\in A)(x\\leq s).\n\
    \\]\n\n\\hyperref[prf:upper-bound-property-of-supremum]{Go to proof.}\n\\end{proposition}"
