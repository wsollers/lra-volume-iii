statement:
  canonical_prose: Positive Scalar Multiplication of the Infimum
  canonical_latex: "\\begin{theorem}[Positive Scalar Multiplication of the Infimum]\n\
    \\label{thm:positive-scalar-mult-infimum}\nLet $A\\subseteq\\mathbb{R}$ be nonempty\
    \ and bounded below, and let\n$k\\in\\mathbb{R}$ satisfy $k>0$.  Then $kA:=\\\
    {ka:a\\in A\\}$ is nonempty and\nbounded below, and\n\\[\n  \\inf(kA)=k\\inf A.\n\
    \\]\n\\hyperref[prf:positive-scalar-mult-infimum]{Go to proof.}\n\\end{theorem}"
