statement:
  canonical_prose: Epsilon Characterization of the Supremum
  canonical_latex: "\\begin{definition}[Epsilon Characterization of the Supremum]\n\
    \\label{def:epsilon-characterization-of-supremum}\nLet $A\\subseteq\\mathbb{R}$\
    \ be nonempty and bounded above, and let\n$s\\in\\mathbb{R}$. Then\n\\[\n  s=\\\
    sup A\n\\]\nif and only if both of the following conditions hold:\n\\[\n  (\\\
    forall a\\in A)(a\\leq s),\n\\]\nand\n\\[\n  (\\forall\\varepsilon>0)(\\exists\
    \ a\\in A)(s-\\varepsilon<a).\n\\]\nEquivalently,\n\\[\n  s=\\sup A\n  \\Longleftrightarrow\n\
    \  \\left[\n    (\\forall a\\in A)(a\\leq s)\n    \\land\n    (\\forall\\varepsilon>0)(\\\
    exists a\\in A)(s-\\varepsilon<a\\leq s)\n  \\right].\n\\]\n\\end{definition}"
