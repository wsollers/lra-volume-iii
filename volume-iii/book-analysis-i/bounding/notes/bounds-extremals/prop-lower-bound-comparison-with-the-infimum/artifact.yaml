statement:
  canonical_prose: Lower-Bound Comparison with the Infimum
  canonical_latex: "\\begin{proposition}[Lower-Bound Comparison with the Infimum]\n\
    \\label{prop:lower-bound-comparison-with-the-infimum}\nLet $A\\subseteq\\mathbb{R}$\
    \ be nonempty and bounded below, and let\n$i=\\inf A$. For every $\\ell\\in\\\
    mathbb{R}$,\n\\[\n  \\ell\\text{ is a lower bound of }A\n  \\Longleftrightarrow\n\
    \  \\ell\\leq i.\n\\]\nEquivalently,\n\\[\n  (\\forall a\\in A)(\\ell\\leq a)\n\
    \  \\Longleftrightarrow\n  \\ell\\leq i.\n\\]\n\n\\hyperref[prf:lower-bound-comparison-with-the-infimum]{Go\
    \ to proof.}\n\\end{proposition}"
