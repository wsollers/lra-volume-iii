  canonical_latex: "\\begin{definition}[Maximum]\n\\label{def:maximum}\nLet $A\\subseteq\\\
    mathbb{R}$ and let $m\\in\\mathbb{R}$. The number $m$ is the\n\\emph{maximum}\
    \ of $A$, written $m=\\max A$, if\n\\[\n  m\\in A\n  \\land\n  (\\forall a\\in\
    \ A)(a\\leq m).\n\\]\n\\end{definition}"
