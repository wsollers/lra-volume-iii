statement:
  canonical_prose: Density of the Irrationals
  canonical_latex: "\\begin{theorem}[Density of the Irrationals]\n\\label{thm:density-of-irrationals-in-reals}\n\
    For every $a,b\\in\\mathbb{R}$ with $a<b$, there exists\n$s\\in\\mathbb{R}\\setminus\\\
    mathbb{Q}$ such that\n\\[\n  a<s<b.\n\\]\nEquivalently,\n\\[\n  (\\forall a,b\\\
    in\\mathbb{R})\n  \\bigl[a<b\\Longrightarrow\n  (\\exists s\\in\\mathbb{R}\\setminus\\\
    mathbb{Q})(a<s<b)\\bigr].\n\\]\n\\hyperref[prf:density-of-irrationals-in-reals]{Go\
    \ to proof.}\n\\end{theorem}"
