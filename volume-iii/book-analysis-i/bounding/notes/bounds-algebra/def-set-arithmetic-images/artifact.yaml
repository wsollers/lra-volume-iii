  canonical_prose: Set Arithmetic Images
  canonical_latex: "\\begin{definition}[Set Arithmetic Images]\n\\label{def:set-arithmetic-images}\n\
    Let $A,B\\subseteq\\mathbb{R}$ and let $c\\in\\mathbb{R}$.  The arithmetic\nimages\
    \ of $A$ and $B$ under addition, subtraction, and multiplication are\ndefined\
    \ by\n\\[\n  A+B:=\\{a+b:a\\in A,\\ b\\in B\\},\n\\]\n\\[\n  A-B:=\\{a-b:a\\in\
    \ A,\\ b\\in B\\},\n\\]\nand\n\\[\n  AB:=\\{ab:a\\in A,\\ b\\in B\\}.\n\\]\nThe\
    \ scalar image of $A$ under multiplication by $c$ is\n\\[\n  cA:=\\{ca:a\\in A\\\
    }.\n\\]\n\\end{definition}"
