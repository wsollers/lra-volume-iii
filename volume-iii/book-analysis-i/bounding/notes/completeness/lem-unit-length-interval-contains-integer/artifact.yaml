  canonical_prose: Unit-Length Interval Contains an Integer
  canonical_latex: "\\begin{lemma}[Unit-Length Interval Contains an Integer]\n\\label{lem:unit-length-interval-contains-integer}\n\
    For every $x\\in\\mathbb{R}$, there exists $m\\in\\mathbb{Z}$ such that\n\\[\n\
    \  x\\leq m\\leq x+1.\n\\]\nEquivalently,\n\\[\n  (\\forall x\\in\\mathbb{R})([x,x+1]\\\
    cap\\mathbb{Z}\\neq\\varnothing).\n\\]\n\n\\smallskip\n\\noindent\n\\hyperref[prf:unit-length-interval-contains-integer]{\\\
    textit{Go to proof.}}\n\\end{lemma}"
