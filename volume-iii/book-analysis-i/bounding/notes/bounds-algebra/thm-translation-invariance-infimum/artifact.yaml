statement:
  canonical_prose: Translation Invariance of the Infimum
  canonical_latex: "\\begin{theorem}[Translation Invariance of the Infimum]\n\\label{thm:translation-invariance-infimum}\n\
    Let $A\\subseteq\\mathbb{R}$ be nonempty and bounded below, and let\n$c\\in\\\
    mathbb{R}$.  Then $A+c:=\\{a+c:a\\in A\\}$ is nonempty and bounded below,\nand\n\
    \\[\n  \\inf(A+c)=\\inf A+c.\n\\]\n\\hyperref[prf:translation-invariance-infimum]{Go\
    \ to proof.}\n\\end{theorem}"
