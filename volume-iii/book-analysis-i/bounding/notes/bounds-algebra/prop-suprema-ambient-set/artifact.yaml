statement:
  canonical_prose: Suprema Depend on the Ambient Set
  canonical_latex: "\\begin{proposition}[Suprema Depend on the Ambient Set]\n\\label{prop:suprema-ambient-set}\n\
    There exist a linearly ordered set $(P,\\leq)$, subsets\n$A\\subseteq S\\subseteq\
    \ S'\\subseteq P$, and relative suprema $\\sup_S A$ and\n$\\sup_{S'}A$ such that\n\
    \\[\n  \\sup_S A\\ne\\sup_{S'}A.\n\\]\nFor example, in $\\mathbb{R}$, let\n\\\
    [\n  A=(0,1),\\qquad\n  S=(0,1)\\cup\\{2\\},\n  \\qquad\n  S'=(0,1)\\cup\\left\\\
    {\\frac{3}{2},2\\right\\}.\n\\]\nThen\n\\[\n  \\sup_S A=2,\n  \\qquad\n  \\sup_{S'}A=\\\
    frac{3}{2}.\n\\]\n\\hyperref[prf:suprema-ambient-set]{Go to proof.}\n\\end{proposition}"
  semantic_ast: &id001
