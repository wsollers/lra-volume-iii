statement:
  canonical_prose: Least-Upper-Bound Property Implies Existence of Suprema
  canonical_latex: "\\begin{theorem}[Least-Upper-Bound Property Implies Existence\
    \ of Suprema]\n\\label{thm:lub-property-implies-existence-of-suprema}\nLet $A\\\
    subseteq\\mathbb{R}$ be nonempty and bounded above. Then there\nexists a unique\
    \ $s\\in\\mathbb{R}$ such that\n\\[\n  s=\\sup A.\n\\]\nEquivalently,\n\\[\n \
    \ (\\forall A\\subseteq\\mathbb{R})\n  \\left[\n    A\\neq\\varnothing\n    \\\
    land\n    (\\exists u\\in\\mathbb{R})(\\forall a\\in A)(a\\leq u)\n    \\Longrightarrow\n\
    \    (\\exists!s\\in\\mathbb{R})(s=\\sup A)\n  \\right].\n\\]\n\n\\hyperref[prf:lub-property-implies-existence-of-suprema]{Go\
    \ to proof.}\n\\end{theorem}"
