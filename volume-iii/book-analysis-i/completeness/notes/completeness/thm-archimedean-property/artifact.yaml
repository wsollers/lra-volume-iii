statement:
  canonical_prose: Archimedean Property
  canonical_latex: "\\begin{theorem}[Archimedean Property]\n\\label{thm:archimedean-property}\n\
    For every $x,y\\in\\mathbb{R}$, if $x>0$ and $y>0$, then there exists\n$n\\in\\\
    mathbb{N}$ such that\n\\[\n  nx>y.\n\\]\nEquivalently,\n\\[\n  (\\forall x,y\\\
    in\\mathbb{R})\n  \\bigl[(x>0\\land y>0)\\Longrightarrow(\\exists n\\in\\mathbb{N})(nx>y)\\\
    bigr].\n\\]\n\n\\smallskip\n\\noindent\n\\hyperref[prf:archimedean-property]{\\\
    textit{Go to proof.}}\n\\end{theorem}"
